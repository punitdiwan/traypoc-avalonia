name: Build packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # ----------------------------------------------------------------------------
  # Detect which subtrees changed so each job only runs when relevant.
  # ----------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packaging/**'
              - 'TrayPoc.slnx'
              - '.github/workflows/build.yml'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/workflows/build.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/build.yml'

  # ----------------------------------------------------------------------------
  # Web dashboard (React + Vite): typecheck + production build
  # ----------------------------------------------------------------------------
  web:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @time-tracker/web build

  # ----------------------------------------------------------------------------
  # API server (Go): build, vet, test
  # ----------------------------------------------------------------------------
  api:
    name: API build
    needs: changes
    if: needs.changes.outputs.api == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # The server is pure Go (pgx/chi/asynq), so CGO-free static cross-compiles
      # work for both targets without a toolchain per OS.
      - name: Build server binaries (linux + windows)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/timetracker-api-linux-amd64     ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/timetracker-api-windows-amd64.exe ./cmd/server
          cp .env.example dist/
          ls -la dist

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: timetracker-api
          path: apps/api/dist/*
          # .env.example is a dotfile; upload-artifact v4 skips hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Linux: self-contained publish -> AppImage (with system tray)
  # ----------------------------------------------------------------------------
  linux-appimage:
    name: Linux AppImage
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: packaging/linux/appimagetool-x86_64.AppImage
          key: appimagetool-x86_64-continuous

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh "${{ steps.ver.outputs.version }}" linux-x64

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayPoc-linux-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/install.sh
            dist/uninstall.sh
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Windows: self-contained publish -> MSI via WiX v5
  # ----------------------------------------------------------------------------
  windows-msi:
    name: Windows MSI
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish app (win-x64, self-contained)
        run: >
          dotnet publish apps/desktop/TrayPoc.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Build MSI (WiX v5)
        run: >
          dotnet build packaging/windows/TrayPoc.Installer/TrayPoc.Installer.wixproj
          -c Release
          -p:ProductVersion=${{ steps.ver.outputs.version }}
          -p:PublishDir=${{ github.workspace }}\publish\win-x64\

      - name: Collect MSI
        shell: bash
        run: |
          mkdir -p dist
          find packaging/windows/TrayPoc.Installer/bin -name '*.msi' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayPoc-win-x64-MSI
          path: dist/*.msi
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # On a version tag, publish both artifacts to a GitHub Release
  # ----------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux-appimage, windows-msi, api ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.msi
            artifacts/**/install.sh
            artifacts/**/uninstall.sh
            artifacts/**/timetracker-api-*
