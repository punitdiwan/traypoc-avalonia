services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../apps/api/.env
    environment:
      - PORT=8080
      - CORS_ORIGIN=https://timetracker.maitretech.com
      # Use the bundled redis service; overrides REDIS_URL from .env.
      - REDIS_URL=redis:6379
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
