services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../apps/api/.env
    environment:
      - PORT=8080
      - CORS_ORIGIN=https://timetracker.maitretech.com
      # Use the external redis service; overrides REDIS_URL from .env.
      - REDIS_URL=studio.maitretech.com:6379
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file: ../apps/web/.env
    # Static SPA bundle behind the in-container nginx. The host nginx terminates
    # TLS and proxies / here, and /api + /ws to the api service above.
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped

