# HOST nginx (not in a container): the single public TLS entrypoint for the
# whole stack. Install at /etc/nginx/sites-available/timetracker.conf, symlink
# into sites-enabled, then run certbot to fill in the TLS lines:
#
#   sudo ln -s /etc/nginx/sites-available/timetracker.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d timetracker.maitretech.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing (everything same-origin, so no CORS in the browser):
#   /        -> web container   (127.0.0.1:8082)  static SPA + SPA fallback
#   /api/    -> api container   (127.0.0.1:8081)  Go backend (/api prefix stripped)
#   /ws      -> api container   (127.0.0.1:8081)  WebSocket signaling (calls/chat)

server {
    listen 80;
    server_name timetracker.maitretech.com;
    # certbot replaces this with the HTTPS redirect + ACME challenge handling.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name timetracker.maitretech.com;

    # certbot fills these in automatically.
    ssl_certificate     /etc/letsencrypt/live/timetracker.maitretech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetracker.maitretech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headroom for any API multipart uploads (claim docs etc.).
    client_max_body_size 25m;

    # API: trailing slash on proxy_pass strips the /api prefix, so the Go
    # routes stay at root (/auth/login, /time-logs, ...).
    location /api/ {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket signaling for voice calls + chat. Needs the Upgrade headers and
    # a long read timeout so idle-but-open call sockets aren't dropped.
    location /ws {
        proxy_pass         http://127.0.0.1:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else: the static SPA (the web container does the SPA fallback).
    location / {
        proxy_pass        http://127.0.0.1:8082;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }
}
