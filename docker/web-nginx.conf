# In-container nginx: serves the static SPA bundle only.
# /api and /ws are routed by the HOST nginx straight to the api container,
# so they never reach here. This block just handles static files + SPA fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker or the HTML shell, so deploys roll out.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths (deep links like /diary/:id) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
